[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
admin_passwd = admin_master_secret_2026
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo_secure_password_2026
db_name = odoo_travel
dbfilter = ^odoo_travel$

; Development mode: workers = 0 để tránh session mismatch & chạy đồng bộ
workers = 0
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 120
limit_time_real = 240

; Bảo mật & Logging
proxy_mode = True
log_level = info
list_db = True
