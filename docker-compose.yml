version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: odoo18_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo_pgdata:/var/lib/postgresql/data/pgdata
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: odoo18_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_secure_password_2026}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./odoo_addons:/mnt/extra-addons
    networks:
      - erp_network
    ports:
      - "8069:8069"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail_backend
    restart: unless-stopped
    depends_on:
      - odoo
    environment:
      - ODOO_URL=http://odoo:8069
      - ODOO_DB=${ODOO_DB:-odoo_retail_db}
      - ODOO_USER=${ODOO_USER:-integration_api_user}
      - ODOO_API_KEY=${ODOO_API_KEY:-your_odoo_generated_api_key_here}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/ecommerce_bridge.db
      - FASTAPI_ENV=development
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - backend_sqlite_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - erp_network

  nginx:
    image: nginx:alpine
    container_name: odoo_nginx_proxy
    restart: unless-stopped
    depends_on:
      - odoo
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - erp_network

volumes:
  odoo_pgdata:
  odoo_data:
  backend_sqlite_data:

networks:
  erp_network:
    driver: bridge
